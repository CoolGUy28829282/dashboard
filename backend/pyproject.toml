[project]
name = "premarket"
version = "0.1.0"
description = "Pre-market CRT dashboard backend for NQ / ES / GC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pandas>=2.2,<3",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pyyaml>=6",
  "yfinance>=0.2.40",
  "feedparser>=6",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-python-dateutil", "freezegun>=1.5"]

[project.scripts]
premarket = "premarket.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["premarket"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]
ignore = ["B008", "E501", "E741"]  # long f-string sentences are fine; `l` is the CRT low

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
