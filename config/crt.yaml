min_sweep_ticks: 2
max_sweep_pct: 60          # sweep depth as % of range beyond which quality is penalised
displacement_k: 1.0        # body >= k * ATR14 of the execution timeframe
equal_highs_tolerance_ticks: 4
stop_buffer_ticks: 4
key_time_first_minutes: 15
mss_confirmation: false    # optional 5m market-structure-shift confirmation
late_confirmation_after: "11:30"
stats: { lookback_months: 12, exclude_red_folder: true }
quality:                   # additive points; clamped 0..100
  base: 30
  context_level: 20
  key_time: 15
  displacement: 10
  smt: 10
  aligned_bias: 10
  aligned_premium_discount: 5
  odds_bonus_max: 10       # scaled by measured P(reach EQ) above 0.5, only when n >= 30
  penalty_orange_within_30m: -15
  penalty_deep_sweep: -15
  penalty_late_confirmation: -20
